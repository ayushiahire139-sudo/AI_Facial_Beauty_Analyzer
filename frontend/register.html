<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - AI Facial Beauty Analyzer</title>
    <link rel="stylesheet" href="CSS/style.css">
    <script src="JS/theme.js"></script>
</head>

<body>

    <!-- Navigation -->
    <nav>
        <div class="logo">
            ✨ AI Beauty Analyzer
        </div>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="register.html" class="active">Register</a></li>
            <li><a href="login.html">Login</a></li>
            <li>
                <div class="theme-switch-container">
                    <span>Style:</span>
                    <select id="themeSelector" class="theme-dropdown">
                        <option value="theme-glass">Hologram Glass</option>
                        <option value="theme-cyberpunk">Cyberpunk Glow</option>
                        <option value="theme-orchid">Luxury Orchid</option>
                        <option value="theme-emerald">Emerald Serene</option>
                    </select>
                </div>
            </li>
        </ul>
    </nav>

    <!-- Register Layout -->
    <div class="auth-container">
        <div class="auth-card">
            <h2>Create Account</h2>
            <h3>Join us to analyze your facial proportions</h3>

            <div class="form-group">
                <label for="fullname">Full Name</label>
                <input type="text" id="fullname" class="form-input" placeholder="Your Name" required>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" class="form-input" placeholder="name@example.com" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" class="form-input" placeholder="••••••••" required>
            </div>

            <button onclick="registerUser()" class="auth-button">
                Create Account
            </button>

            <div class="auth-footer">
                Already have an account? <a href="login.html">Login</a>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer>
        <p>© 2026 AI Facial Beauty Analyzer. All rights reserved.</p>
    </footer>

    <script src="JS/register.js"></script>
</body>

</html>
